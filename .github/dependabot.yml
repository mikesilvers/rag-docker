# Dependabot version updates. They target the repository's default branch
# (develop); security updates always do, whatever this file says.
#
# api/ (pip) is deliberately absent. api/requirements.txt is a pip-freeze
# lock that must be regenerated from requirements.in, never bumped one pin at
# a time. See "Dependency management" in README.md. mcp/ is parked.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    groups:
      ui-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # vite 8 needs a newer @vitejs/plugin-react; upgrade both together
      # by hand (see closed PRs #3, #5, #17).
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories: ["/api", "/ui"]
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # ollama 0.34.4 timed out on /api/chat with phi3.5 (5 of 15 calls hit
      # the 5-minute limit; 0.3.14 answers in 3-33s). Upgrade by hand and run
      # the full scripts/verify/all.sh. See closed PR #15.
      - dependency-name: "ollama/ollama"
      # Weaviate also publishes single-platform tags such as
      # 1.40.2-9858973.arm64, which sort above the plain multi-arch 1.40.2 and
      # which a versions rule cannot single out (see closed PR #527). Upgrade
      # by hand to the plain X.Y.Z tag and run the full verify suite
      # (bash scripts/verify/stack.sh run). See #530.
      - dependency-name: "semitechnologies/weaviate"
