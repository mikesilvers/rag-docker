events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream api {
        server api:8000;
    }

    upstream ui {
        server ui:3000;
    }

    server {
        listen 80;

        # The routes live in locations.conf, shared with LAN mode's nginx.lan.conf (#26).
        include /etc/nginx/rag/locations.conf;
    }
}
